name: Build blog posts.json

on:
  push:
    branches: [main]
    paths:
      - 'Main/posts/**'
      - 'Main/scripts/build-posts.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build posts.json
        working-directory: Main
        run: node scripts/build-posts.js

      - name: Commit posts.json if changed
        run: |
          if ! git diff --quiet -- Main/posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Main/posts.json
            git commit -m "chore: rebuild posts.json"
            git push
          else
            echo "No changes to posts.json"
          fi
