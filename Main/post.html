  background-size: cover;
  color: var(--ink);

  overflow-x: hidden;
}
</style>

<body>
  <div class="stage">
    <nav class="site-nav">

      </div>

    <a href="blog.html" class="back-link">← Back to blog</a>

    <article id="post" class="post-article">
      <p>Loading…</p>
    </article>
  </div>

  <footer class="site-footer">
    &copy; 2026 Saha · your data stays yours, always.
  </footer>

<script>
const STORAGE_KEY = 'saha_posts';

function qs(name){
  return new URL(window.location.href).searchParams.get(name);
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function formatDate(d){
  try {
    return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  } catch(e){ return d; }
}

// Minimal markdown -> HTML (headings, bold, italic, code, lists, quotes, paragraphs)
function renderMarkdown(md){
  const lines = (md || '').replace(/\r\n/g,'\n').split('\n');
  let html = '';
  let inList = false;
  let inCode = false;

  for (const raw of lines) {
    const line = raw;

    if (line.trim().startsWith('```')) {
      if (!inCode) { html += '<pre><code>'; inCode = true; }
      else { html += '</code></pre>'; inCode = false; }
      continue;
    }
    if (inCode) { html += escapeHtml(line) + '\n'; continue; }

    if (/^### /.test(line)) { html += `<h3>${inline(line.slice(4))}</h3>`; continue; }
    if (/^## /.test(line))  { html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
    if (/^# /.test(line))   { html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
    if (/^> /.test(line))   { html += `<blockquote>${inline(line.slice(2))}</blockquote>`; continue; }

    if (/^[-*] /.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    } else if (inList) {
      html += '</ul>'; inList = false;
    }

    if (line.trim() === '') continue;
    html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += '</ul>';
  if (inCode) html += '</code></pre>';
  return html;
}

function inline(text){
  let t = escapeHtml(text);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  t = t.replace(/`(.+?)`/g, '<code>$1</code>');
  return t;
}

function load(){
  const id = qs('id');
  const container = document.getElementById('post');

  if (!id) {
    container.innerHTML = '<p>No post specified.</p>';
    return;
  }

  let posts = [];
  try { posts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) {}

  const post = posts.find(p => p.id === id);
  if (!post) {
    container.innerHTML = '<p>This post could not be found.</p>';
    return;
  }

  container.innerHTML = `
    <div class="post-meta">${formatDate(post.date)}${post.tag ? ' · ' + escapeHtml(post.tag) : ''}</div>
    <h1>${escapeHtml(post.title)}</h1>
    <div class="post-body">${renderMarkdown(post.content)}</div>
  `;
}

load();
</script>
</body>
</html>
