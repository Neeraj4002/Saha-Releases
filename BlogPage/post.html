<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Saha — Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{font-family:'Outfit',sans-serif;background:#FBF4EF;color:#2a3d4a;margin:0;padding:28px}
  .stage{max-width:820px;margin:0 auto}
  a{color:#56839F}
  h1{font-family:'Cormorant Garamond',serif;font-size:34px}
  .meta{color:#8aA4b2;margin-bottom:20px}
  .content{font-size:16px;line-height:1.7;background:#fff;padding:24px;border-radius:8px;border:1px solid #ede4dc}
</style>
</head>
<body>
  <div class="stage">
    <a href="blog.html">← Back to Blog</a>
    <div id="post">
      <h1>Loading…</h1>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
<script>
function qs(name){
  const u = new URL(window.location.href);
  return u.searchParams.get(name);
}
function parseFrontmatter(text){
  if(text.startsWith('---')){
    const end = text.indexOf('\n---',3);
    if(end!==-1){
      const fm = text.slice(3,end).trim();
      const rest = text.slice(end+4).trim();
      const meta = {};
      fm.split('\n').forEach(line=>{
        const i = line.indexOf(':');
        if(i>-1){
          const k=line.slice(0,i).trim();
          const v=line.slice(i+1).trim();
          meta[k]=v.replace(/^\"|\"$/g,'');
        }
      });
      return {meta,content:rest};
    }
  }
  return {meta:{},content:text};
}
async function load(){
  const path = qs('path');
  if(!path){document.getElementById('post').innerHTML='<p>No post specified.</p>';return}
  try{
    const res = await fetch(decodeURIComponent(path));
    if(!res.ok) throw new Error('Not found');
    const text = await res.text();
    const isMd = path.endsWith('.md');
    let title='';let metaHtml='';let html='';
    if(isMd){
      const parsed = parseFrontmatter(text);
      title = parsed.meta.title || '';
      metaHtml = parsed.meta.date?`<div class="meta">${parsed.meta.date}</div>`:'';
      html = marked.parse(parsed.content);
    } else {
      // treat as HTML
      html = text;
    }
    const safe = DOMPurify.sanitize(html,{ADD_ATTR:['target']});
    const container = document.getElementById('post');
    container.innerHTML = `
      ${title?`<h1>${title}</h1>`:''}
      ${metaHtml}
      <div class="content">${safe}</div>
    `;
  }catch(e){
    document.getElementById('post').innerHTML = '<p>Unable to load post.</p>';
  }
}
load();
</script>
</body>
</html>
