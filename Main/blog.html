<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saha — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
      html, body {
  width: 100%; min-height: 100vh;
  background: url('Lowerclouds.jpg') no-repeat center center fixed;
  background-size: cover;
  color: var(--ink);

  overflow-x: hidden;
}
</style>
</head>
<body>
  <div class="stage">
    <nav class="site-nav">
      <div class="wordmark">Saha</div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="blog.html" class="nav-link active">Blog</a>
      </div>
    </nav>

    <div class="page-header">
      <div class="page-eyebrow">from the team</div>
      <h1 class="page-title">The Saha <em>Blog</em></h1>
      <p class="page-sub">Notes, updates, and stories about what we're building and why.</p>
    </div>

    <div id="posts" class="posts-grid"></div>
  </div>

  <footer class="site-footer">
    &copy; 2026 Saha · your data stays yours, always.
  </footer>

<script>
async function loadPosts(){
  try {
    const res = await fetch('posts.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('Failed to load posts.json');
    const posts = await res.json();
    return Array.isArray(posts) ? posts : [];
  } catch (e) {
    console.error(e);
    return [];
  }
}

function formatDate(d){
  try {
    return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  } catch(e){ return d; }
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

async function render(){
  const posts = (await loadPosts())
    .filter(p => !p.draft)
    .sort((a,b) => new Date(b.date) - new Date(a.date));

  const container = document.getElementById('posts');

  if (posts.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="post-title">No posts yet</div>
        <p class="post-excerpt">Check back soon for updates from the team.</p>
      </div>`;
    return;
  }

  container.innerHTML = posts.map(p => `
    <article class="post-card">
      ${p.tag ? `<span class="post-tag">${escapeHtml(p.tag)}</span>` : ''}
      <div class="post-title">${escapeHtml(p.title)}</div>
      <div class="post-meta">${formatDate(p.date)}</div>
      <div class="post-excerpt">${escapeHtml(p.excerpt || '')}</div>
      <a class="read-more" href="post.html?id=${encodeURIComponent(p.id)}">Read →</a>
    </article>
  `).join('');
}

render();
</script>
</body>
</html>
